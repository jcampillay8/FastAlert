services:
  # Backend FastAlert
  api:
    build: .
    container_name: fastalert_api
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
      - ./fastalert.db:/app/fastalert.db
    env_file:
      - .env
    environment:
      - EVOLUTION_API_URL=http://evolution_api:8080
    restart: always
    depends_on:
      - evolution_api

  # WhatsApp Gateway (Evolution API)
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://192.168.100.32:8080

      # --- AUTENTICACIÓN (NOMBRES V2) ---
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=429683C4C97BC44F7E31

      # --- CONFIGURACIÓN DE BASE DE DATOS (POSTGRES) ---
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://fastalert:fastalert@postgres:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=fastalert_api

      # --- CONFIGURACIÓN DE INSTANCIAS ---
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true

      # --- SOLUCIÓN AL ERROR DE REDIS ---
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true

      # --- DASHBOARD Y EXTRAS ---
      - DASHBOARD_ENABLED=true
      - DELAY_MESSAGES=true
      - WEBHOOK_GLOBAL_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    restart: always
    depends_on:
      - postgres

  # Base de Datos para Evolution API
  postgres:
    image: postgres:15-alpine
    container_name: fastalert_db
    environment:
      - POSTGRES_USER=fastalert
      - POSTGRES_PASSWORD=fastalert
      - POSTGRES_DB=evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  evolution_instances:
  postgres_data:
